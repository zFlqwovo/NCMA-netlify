[build]
  command = "npm install"
  functions = "netlify/functions"

[functions]
  node_bundler = "zisi"
  included_files = ["module/**", "util/**", "plugins/**", "public/**", "data/**", "generateConfig.js", "server.js", "main.js", "package.json"]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
